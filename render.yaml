# Render free-tier deployment for the Link Analysis API.
# Create the service from the public GitHub repo (see DEPLOYMENT.md).
# Free tier sleeps after inactivity: warm the URL before submitting.
services:
  - type: web
    name: dxora-link-analysis
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false # set in the Render dashboard (never commit a key)
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: PYTHON_VERSION
        value: 3.12.3
